<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Vulithuba Password</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f8ff; font-family: Arial, sans-serif; color: #12263b; }
      .panel { width: min(420px, calc(100% - 32px)); background: #fff; padding: 28px; border-radius: 20px; box-shadow: 0 16px 36px rgba(19,47,76,.08); }
      label { display: block; font-weight: 700; margin: 14px 0 7px; }
      input, button { width: 100%; padding: 13px; border-radius: 10px; font-size: 1rem; }
      input { box-sizing: border-box; border: 1px solid #ccd8e5; }
      button { margin-top: 18px; border: 0; color: #fff; background: #0f4c81; font-weight: 700; cursor: pointer; }
      a { color: #0f4c81; font-weight: 700; }
      .message { margin-top: 16px; color: #52657b; }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>Forgot password?</h1>
      <p>Enter your account email and we will send a secure one-time reset link.</p>
      <form id="forgotForm">
        <label for="email">Email</label>
        <input id="email" type="email" required />
        <button type="submit">Send reset email</button>
      </form>
      <p class="message" id="message"></p>
      <p><a href="./login.html">Back to login</a></p>
    </main>
    <script>
      const apiBase = window.location.protocol === 'file:' ? 'http://127.0.0.1:3000' : window.location.origin;
      document.getElementById('forgotForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const response = await fetch(`${apiBase}/api/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value.trim() })
        });
        const data = await response.json();
          document.getElementById('message').textContent = data.message || data.error || 'Unable to send reset email.';
      });
    </script>
  </body>
</html>
