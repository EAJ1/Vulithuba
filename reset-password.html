<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Your Vulithuba Password</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f8ff; font-family: Arial, sans-serif; color: #12263b; }
      .panel { width: min(420px, calc(100% - 32px)); background: #fff; padding: 28px; border-radius: 20px; box-shadow: 0 16px 36px rgba(19,47,76,.08); }
      label { display: block; font-weight: 700; margin: 14px 0 7px; }
      input, button { width: 100%; padding: 13px; border-radius: 10px; font-size: 1rem; }
      input { box-sizing: border-box; border: 1px solid #ccd8e5; }
      button { margin-top: 18px; border: 0; color: #fff; background: #0f4c81; font-weight: 700; cursor: pointer; }
      a { color: #0f4c81; font-weight: 700; }
      .message { margin-top: 16px; color: #52657b; }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>Reset your password</h1>
      <p>Create a new password for your Vulithuba account. Enter it twice below to confirm it.</p>
      <form id="resetForm">
        <label for="password">New password</label>
        <input id="password" type="password" minlength="6" autocomplete="new-password" required />
        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required />
        <label><input id="showPasswords" type="checkbox" /> Show passwords</label>
        <button type="submit">Change password</button>
      </form>
      <p class="message" id="message"></p>
      <p><a href="./login.html">Back to login</a></p>
    </main>
    <script>
      const apiBase = window.location.protocol === 'file:' ? 'http://127.0.0.1:3000' : window.location.origin;
      const token = new URLSearchParams(window.location.search).get('token') || '';
      document.getElementById('showPasswords').addEventListener('change', (event) => {
        const type = event.target.checked ? 'text' : 'password';
        document.getElementById('password').type = type;
        document.getElementById('confirmPassword').type = type;
      });
      document.getElementById('resetForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const response = await fetch(`${apiBase}/api/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token,
            password: document.getElementById('password').value,
            confirmPassword: document.getElementById('confirmPassword').value
          })
        });
        const data = await response.json();
        document.getElementById('message').textContent = data.message || data.error || 'Unable to reset password.';
        if (response.ok) setTimeout(() => { window.location.href = `${apiBase}/login.html`; }, 1200);
      });
    </script>
  </body>
</html>
