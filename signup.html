<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vulithuba Sign Up</title>
    <style>
      :root {
        --bg: #f4f8ff;
        --card: #ffffff;
        --primary: #0f4c81;
        --text: #12263b;
        --muted: #52657b;
        --line: rgba(18, 38, 59, 0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f5f9ff 0%, #edf4ff 100%);
        font-family: Arial, sans-serif;
        color: var(--text);
      }
      .panel {
        width: min(460px, calc(100% - 24px));
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 30px;
        box-shadow: 0 18px 40px rgba(19, 47, 76, 0.08);
      }
      h1 { margin: 0 0 8px; font-size: 2rem; }
      p { color: var(--muted); margin-bottom: 20px; }
      label { display: block; margin-bottom: 8px; font-weight: 700; }
      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        margin-bottom: 16px;
        font-size: 1rem;
      }
      select {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        margin-bottom: 16px;
        font-size: 1rem;
        background: #fff;
      }
      .payment-note {
        font-size: 0.85rem;
        margin: 0 0 16px;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--primary) 0%, #1d6fd6 100%);
        color: #fff;
        padding: 14px 20px;
        font-weight: 700;
        cursor: pointer;
      }
      .footer-link {
        text-align: center;
        margin-top: 18px;
      }
      .footer-link a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 700;
      }
      .error {
        display: none;
        background: #fff1f1;
        color: #a82020;
        border: 1px solid #f3c4c4;
        padding: 10px 12px;
        border-radius: 8px;
        margin-bottom: 14px;
      }
      .error.show { display: block; }
      .success {
        display: none;
        background: #ebfff2;
        color: #166b38;
        border: 1px solid #bfe8cb;
        padding: 10px 12px;
        border-radius: 8px;
        margin-bottom: 14px;
      }
      .success.show { display: block; }
      .field-error { display: block; color: #a82020; margin-top: 6px; }
      .field-error[hidden] { display: none; }
      [aria-invalid="true"] { border: 2px solid #a82020; }
      .phone-row { flex-wrap: wrap; }
      .phone-row .field-error { flex-basis: 100%; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Create account</h1>
      <p>Join Vulithuba to manage services, plans and support.</p>

      <div id="errorBox" class="error" role="alert"></div>
      <div id="successBox" class="success" role="status"></div>

      <form id="signupForm" novalidate>
        <div>
          <label for="fullName">Full name</label>
          <input id="fullName" name="fullName" type="text" minlength="2" required aria-describedby="fullNameError" />
          <small id="fullNameError" class="field-error" hidden></small>
        </div>

        <div>
          <label for="phone">Phone number</label>
          <div class="phone-row">
            <select id="countryCode" aria-label="Country calling code">
              <option value="+27">+27 South Africa</option>
              <option value="+1">+1 United States / Canada</option>
              <option value="+44">+44 United Kingdom</option>
              <option value="+61">+61 Australia</option>
              <option value="+64">+64 New Zealand</option>
              <option value="+91">+91 India</option>
              <option value="+86">+86 China</option>
              <option value="+81">+81 Japan</option>
              <option value="+49">+49 Germany</option>
              <option value="+33">+33 France</option>
              <option value="+39">+39 Italy</option>
              <option value="+34">+34 Spain</option>
              <option value="+31">+31 Netherlands</option>
              <option value="+41">+41 Switzerland</option>
              <option value="+971">+971 United Arab Emirates</option>
              <option value="+234">+234 Nigeria</option>
              <option value="+254">+254 Kenya</option>
              <option value="+255">+255 Tanzania</option>
              <option value="+263">+263 Zimbabwe</option>
              <option value="+260">+260 Zambia</option>
              <option value="+265">+265 Malawi</option>
              <option value="+258">+258 Mozambique</option>
              <option value="+20">+20 Egypt</option>
              <option value="+212">+212 Morocco</option>
              <option value="+55">+55 Brazil</option>
              <option value="+52">+52 Mexico</option>
              <option value="+7">+7 Russia / Kazakhstan</option>
              <option value="+82">+82 South Korea</option>
              <option value="+65">+65 Singapore</option>
            </select>
            <input id="phone" name="phone" type="tel" minlength="7" placeholder="Phone number" required aria-describedby="phoneError" />
          <small id="phoneError" class="field-error" hidden></small>
          </div>
        </div>

        <div>
          <label for="username">Username</label>
          <input id="username" name="username" type="text" minlength="3" required aria-describedby="usernameError" />
          <small id="usernameError" class="field-error" hidden></small>
        </div>

        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required aria-describedby="emailError" />
          <small id="emailError" class="field-error" hidden></small>
        </div>

        <div>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" minlength="6" required aria-describedby="passwordError" />
          <small id="passwordError" class="field-error" hidden></small>
        </div>

        <div>
          <label for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" minlength="6" required aria-describedby="confirmPasswordError" />
          <small id="confirmPasswordError" class="field-error" hidden></small>
        </div>

        <div>
          <label for="address">Installation address</label>
          <input id="address" name="address" type="text" minlength="5" placeholder="Street, suburb, town" required aria-describedby="addressError" />
          <small id="addressError" class="field-error" hidden></small>
        </div>

        <div>
          <label for="plan">Choose a plan</label>
          <select id="plan" name="plan" required aria-describedby="planError">
            <option value="">Choose an option</option>
            <option value="Fibre Lite">Fibre Lite - R399/month</option>
            <option value="Family Plus">Family Plus - R699/month</option>
            <option value="Office Pro">Office Pro - R1,299/month</option>
          </select>
          <small id="planError" class="field-error" hidden></small>
        </div>

        <div>
          <label for="billingMethod">Preferred payment method</label>
          <select id="billingMethod" name="billingMethod" required aria-describedby="billingMethodError">
            <option value="">Choose an option</option>
            <option value="EFT">EFT / bank transfer</option>
            <option value="Debit order">Debit order</option>
            <option value="Card">Card - secure checkout later</option>
          </select>
          <small id="billingMethodError" class="field-error" hidden></small>
        </div>

        <div>
          <label for="verificationMethod">Verify account by</label>
          <select id="verificationMethod" name="verificationMethod" required aria-describedby="verificationMethodError">
            <option value="">Choose an option</option>
            <option value="email">Email one-time code</option>
            <option value="sms">SMS one-time code</option>
          </select>
          <small id="verificationMethodError" class="field-error" hidden></small>
        </div>

        <p class="payment-note">Your card details are never stored on this website. A secure payment provider can be connected for card payments.</p>

        <button type="submit" id="signupButton">Sign up</button>
      </form>

      <div class="footer-link">
        <a href="./login.html">Already have an account? Log in</a>
      </div>
      <div class="footer-link">
        <a href="./index.html">Back to website</a>
      </div>
    </div>

    <script src="registration-validation.js?v=20261014"></script>
    <script src="signup.js?v=20261014"></script>
  </body>
</html>
