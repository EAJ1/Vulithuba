<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Vulithuba Account</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f8ff; font-family: Arial, sans-serif; color: #12263b; }
      .panel { width: min(420px, calc(100% - 32px)); background: #fff; padding: 28px; border-radius: 20px; box-shadow: 0 16px 36px rgba(19,47,76,.08); }
      label { display: block; font-weight: 700; margin: 14px 0 7px; }
      input, button { width: 100%; padding: 13px; border-radius: 10px; font-size: 1rem; box-sizing: border-box; }
      input { border: 1px solid #ccd8e5; }
      button { margin-top: 18px; border: 0; color: #fff; background: #0f4c81; font-weight: 700; cursor: pointer; }
      .message { margin-top: 16px; color: #52657b; }
      a { color: #0f4c81; font-weight: 700; }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>Verify your account</h1>
      <p>Enter the six-digit code sent to your selected email address or phone.</p>
      <form id="verifyForm">
        <label for="code">One-time code</label>
        <input id="code" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required />
        <button type="submit">Verify account</button>
      </form>
      <button id="resendButton" type="button">Resend verification code</button>
      <p class="message" id="message"></p>
      <p><a href="./login.html">Back to login</a></p>
    </main>
    <script>
      const apiBase = window.location.protocol === 'file:' ? 'http://127.0.0.1:3000' : window.location.origin;
      const query = new URLSearchParams(window.location.search);
      const username = query.get('username') || '';
      const channel = query.get('channel') === 'sms' ? 'sms' : 'email';
      document.getElementById('verifyForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const response = await fetch(`${apiBase}/api/verify-account`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, code: document.getElementById('code').value.trim() })
        });
        const data = await response.json();
        document.getElementById('message').textContent = data.message || data.error || 'Unable to verify account.';
        if (response.ok) setTimeout(() => { window.location.href = `${apiBase}/login.html`; }, 1000);
      });
      document.getElementById('resendButton').addEventListener('click', async () => {
        const response = await fetch(`${apiBase}/api/resend-verification`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, channel })
        });
        const data = await response.json();
        document.getElementById('message').textContent = data.message || data.error || 'Unable to resend code.';
      });
    </script>
  </body>
</html>
